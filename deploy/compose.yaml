name: episteme
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: episteme
      POSTGRES_USER: episteme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment file}
    volumes:
      - type: bind
        source: '${EPISTEME_DATA_ROOT}/database'
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U episteme -d episteme"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    image: episteme-local:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Episteme: 'Host=db;Database=episteme;Username=episteme;Password=${POSTGRES_PASSWORD}'
    command: ["dotnet", "/app/migrate/Episteme.Migrate.dll"]

  web:
    image: episteme-local:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "0.0.0.0:18080:18080"
      - "0.0.0.0:18081:18081"
      - "0.0.0.0:18082:18082"
      - "127.0.0.1:18084:18084"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Episteme: 'Host=db;Database=episteme;Username=episteme;Password=${POSTGRES_PASSWORD}'
      WorkspaceStorageRoot: /workspaces
      Authentication__Authority: http://localhost:18081/
      Authentication__ClientId: episteme-web
      Authentication__ApiAudience: http://localhost:18082/
      Authentication__Audience: http://localhost:18082/
      Authentication__Issuer: http://localhost:18081/
      Authentication__McpAudience: http://localhost:18084/mcp
      Authentication__Client__Id: episteme-web
      Authentication__Client__RedirectUri: http://localhost:18080/signin-oidc
      Api__BaseUrl: http://localhost:18082/
    volumes:
      - type: bind
        source: '${EPISTEME_DATA_ROOT}/web-state'
        target: /state/web
      - type: bind
        source: '${EPISTEME_DATA_ROOT}/auth-state'
        target: /state/auth
      - type: bind
        source: '${EPISTEME_DATA_ROOT}/api-state'
        target: /state/api
      - type: bind
        source: '${EPISTEME_DATA_ROOT}/workspaces'
        target: /workspaces
    command: ["bash", "/app/start.sh"]
