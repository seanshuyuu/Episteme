<!doctype html>
<html lang="zh-CN" data-theme="mint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#79c6a3">
<title>Episteme · 知书｜通用文档操作系统 · 交互原型 v0.1</title>
<style>
:root{
  --bg:#f6faf8; --panel:#fff; --panel2:#f2f8f5; --line:#e4eeea;
  --text:#2c3b43; --muted:#7d9199; --faint:#a7b7bd;
  --primary:#79c6a3; --primary-soft:#e8f6ee; --primary-deep:#3f8d69;
  --green:#79c6a3; --green-s:#e8f6ee; --blue:#8bb9e8; --blue-s:#e9f2fd;
  --purple:#b2a3e0; --purple-s:#f0ebfb; --pink:#eda7c0; --pink-s:#fdeef4;
  --amber:#ba7517; --amber-s:#faeeda; --red:#e24b4a; --red-s:#fcebeb;
  --shadow:0 6px 22px rgba(70,110,100,.07); --shadow-lg:0 16px 48px rgba(50,90,80,.16);
  --r:16px; --r-sm:10px;
}
html[data-theme="sky"]{--bg:#f5f9fd;--panel2:#f0f6fc;--line:#e3ecf6;--primary:#8bb9e8;--primary-soft:#e9f2fd;--primary-deep:#3f78b4;}
html[data-theme="lilac"]{--bg:#f9f7fd;--panel2:#f5f2fb;--line:#ece7f5;--primary:#b2a3e0;--primary-soft:#f0ebfb;--primary-deep:#7a63ba;}
html[data-theme="blush"]{--bg:#fdf7f9;--panel2:#fdf2f6;--line:#f4e8ee;--primary:#eda7c0;--primary-soft:#fdeef4;--primary-deep:#b96288;}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,textarea,select{outline:none}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#d9e5e0;border-radius:8px}
.app{display:flex;height:100vh;overflow:hidden}

/* ---------- sidebar ---------- */
.sidebar{width:252px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 12px}
.brand-mark{width:34px;height:34px;border-radius:11px;background:var(--primary-soft);color:var(--primary-deep);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.brand-name{font-size:15px;font-weight:750;letter-spacing:.2px;line-height:1.2}
.brand-sub{font-size:10.5px;color:var(--muted);letter-spacing:1.1px;text-transform:uppercase}
.space-box{margin:4px 12px 12px;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.space-box .lbl{font-size:10px;color:var(--muted);letter-spacing:.6px;margin-bottom:5px}
.space-select{width:100%;border:0;background:transparent;font-weight:650;font-size:12.5px;cursor:pointer}
.side-scroll{flex:1;overflow-y:auto;padding:0 10px 18px}
.side-title{display:flex;align-items:center;justify-content:space-between;padding:12px 6px 6px;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.7px}
.side-title button{font-size:11px;color:var(--primary-deep);font-weight:700;padding:2px 6px;border-radius:6px}
.side-title button:hover{background:var(--primary-soft)}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;font-size:12.5px;color:var(--text);cursor:pointer;width:100%;text-align:left}
.nav-item:hover{background:var(--panel2)}
.nav-item.active{background:var(--primary-soft);color:var(--primary-deep);font-weight:700}
.nav-item .n-ico{width:16px;text-align:center;flex:none;font-size:13px}
.nav-item .n-badge{margin-left:auto;font-size:10px;color:var(--muted);background:var(--panel2);border-radius:20px;padding:1px 7px}
.tree-row{display:flex;align-items:center;gap:5px;border-radius:8px;padding:5px 6px;font-size:12.2px;cursor:pointer}
.tree-row:hover{background:var(--panel2)}
.tree-row.active{background:var(--primary-soft);color:var(--primary-deep);font-weight:650}
.tree-caret{width:14px;text-align:center;color:var(--faint);font-size:10px;flex:none;user-select:none}
.tree-caret.leaf{opacity:.25}
.tree-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.tree-type{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 4px;flex:none}
.tree-hidden{opacity:.5}
.side-foot{padding:10px 14px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.6}

/* ---------- topbar ---------- */
.main-wrap{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:60px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);z-index:30}
.hamb{display:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);place-items:center;font-size:16px}
.crumb{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;min-width:0;flex:1;overflow:hidden;white-space:nowrap}
.crumb b{color:var(--text);font-weight:650;overflow:hidden;text-overflow:ellipsis}
.top-search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 10px;font-size:11.5px;color:var(--muted);cursor:pointer;min-width:168px}
.top-search:hover{border-color:var(--primary)}
.theme-dots{display:flex;gap:6px;align-items:center}
.theme-dot{width:17px;height:17px;border-radius:50%;border:2px solid transparent;box-shadow:0 0 0 1px var(--line)}
.theme-dot.active{border-color:var(--panel);box-shadow:0 0 0 2px var(--primary-deep)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);white-space:nowrap;cursor:pointer}
.pill.live{background:var(--green-s);color:var(--primary-deep);border-color:transparent;font-weight:650}
.pill:hover{border-color:var(--primary)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--primary);display:inline-block}
.content{flex:1;overflow-y:auto;padding:22px 24px 40px;scroll-behavior:smooth}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-title{font-size:21px;font-weight:750;letter-spacing:-.3px;margin:0}
.page-desc{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:660px}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- common ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:9px;font-size:12.3px;font-weight:650;border:1px solid var(--line);background:var(--panel);white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--primary);transform:translateY(-1px)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-deep)}
.btn.soft{background:var(--primary-soft);color:var(--primary-deep);border-color:transparent}
.btn.danger{color:var(--red);border-color:var(--red-s);background:var(--red-s)}
.btn.sm{padding:5px 10px;font-size:11.3px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:10.8px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.green{background:var(--green-s);color:var(--primary-deep);border-color:transparent}
.chip.blue{background:var(--blue-s);color:#3f78b4;border-color:transparent}
.chip.purple{background:var(--purple-s);color:#7a63ba;border-color:transparent}
.chip.amber{background:var(--amber-s);color:var(--amber);border-color:transparent}
.chip.red{background:var(--red-s);color:var(--red);border-color:transparent}
.input,.select,.textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12.5px;transition:.15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);background:var(--panel)}
.textarea{resize:vertical;min-height:90px;line-height:1.7}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;font-weight:650;margin-bottom:5px}
.field .hint{font-size:10.5px;color:var(--muted);margin-top:4px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:11.8px;cursor:pointer;user-select:none}
.check input{accent-color:var(--primary);width:14px;height:14px}
.small{font-size:12px}.muted{color:var(--muted)}.tiny{font-size:10.8px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.section-title{font-size:12.5px;font-weight:700;margin:0 0 11px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.divider{height:1px;background:var(--line);margin:16px 0}
.banner{padding:10px 13px;border-radius:10px;font-size:12px;margin-bottom:14px;background:var(--primary-soft);color:var(--primary-deep);border:1px solid transparent}
.banner.warn{background:var(--amber-s);color:var(--amber)}
.banner.err{background:var(--red-s);color:var(--red)}
.banner.info{background:var(--blue-s);color:#3f78b4}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty-ico{width:64px;height:64px;border-radius:20px;background:var(--primary-soft);color:var(--primary-deep);display:grid;place-items:center;font-size:30px;margin:0 auto 16px}
.empty h2{font-size:19px;color:var(--text);margin:0 0 8px}
.empty p{font-size:12.5px;max-width:460px;margin:0 auto 20px;line-height:1.8}
.table{width:100%;border-collapse:collapse;font-size:12.2px}
.table th{text-align:left;font-weight:650;color:var(--muted);font-size:11px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel2)}
.table td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:hover td{background:var(--panel2)}
.table tr.clickable{cursor:pointer}
.row-actions{display:flex;gap:6px}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);font-size:10.5px;color:var(--muted);margin:1px 3px 1px 0}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .num{font-size:22px;font-weight:750;letter-spacing:-.5px}
.stat .lbl{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 13px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tab.active{color:var(--primary-deep);border-bottom-color:var(--primary)}
.tab:hover{color:var(--text)}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}
.list-item:last-child{border-bottom:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted);flex:none}
.kv .v{text-align:right;word-break:break-all}
.codeblk{background:#f7fafb;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font:11px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;color:#465c68;max-height:300px;overflow:auto}

/* ---------- viewers ---------- */
.viewer-shell{display:grid;grid-template-columns:1fr 250px;gap:14px}
.viewer-main{min-width:0}
.editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.editor-pane{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
.editor-head{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:10.8px;color:var(--muted);font-weight:650}
.editor-area{width:100%;min-height:290px;border:0;background:var(--panel);padding:14px;font:12px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical;display:block}
.md-preview{padding:14px 18px;min-height:290px;font-size:12.8px;line-height:1.85;overflow:auto}
.md-preview h2{font-size:16px;margin:14px 0 8px}.md-preview h3{font-size:14px;margin:12px 0 6px}
.md-preview p{margin:7px 0}.md-preview ul{margin:7px 0;padding-left:20px}
.md-preview code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:11.5px}
.md-preview pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto}
.md-preview strong{color:var(--primary-deep)}
.code-view{display:grid;grid-template-columns:42px 1fr;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;min-height:290px}
.code-lines{padding:14px 8px;background:var(--panel2);color:var(--faint);font:11.5px/1.8 ui-monospace,monospace;text-align:right;user-select:none;border-right:1px solid var(--line)}
.code-body{padding:14px;font:12px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow:auto}
.code-body .k{color:#7a63ba;font-weight:650}.code-body .s{color:#3f8d69}.code-body .c{color:#a7b7bd;font-style:italic}.code-body .n{color:#ba7517}
.pdf-paper{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:6px;padding:34px 38px;max-width:660px;margin:0 auto 16px;font:12.5px/2.05 Georgia,"Songti SC",serif;color:#33414a;min-height:420px}
.pdf-paper h3{font:700 16px/1.5 -apple-system,"PingFang SC",sans-serif;margin:0 0 4px}
.pdf-paper .pdf-meta{font:10.5px/1.6 -apple-system,sans-serif;color:var(--muted);margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:10px}
.pdf-paper p{margin:0 0 11px;text-indent:2em}
.pdf-paper mark{background:#ffeaa0;border-radius:3px;padding:1px 2px;cursor:pointer}
.web-reader{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel)}
.web-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-size:11px}
.web-url{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 9px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.web-body{padding:22px 30px;font-size:13px;line-height:1.9;max-width:720px}
.web-body h2{font-size:18px;margin:0 0 10px}.web-body p{margin:0 0 12px}
.web-body mark{background:#ffeaa0;border-radius:3px;padding:1px 2px;cursor:pointer}
.web-raw .web-body{background:repeating-linear-gradient(0deg,#fff,#fff 28px,#fafcfb 28px,#fafcfb 56px)}
.web-raw .ad{background:var(--amber-s);color:var(--amber);font-size:10.5px;padding:6px 10px;border-radius:6px;margin-bottom:10px}
.ann-item{padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;font-size:11.5px;background:var(--panel);cursor:pointer}
.ann-item:hover{border-color:var(--primary)}
.ann-item .q{color:var(--muted);font-size:10.5px;border-left:2px solid var(--primary);padding-left:7px;margin:5px 0}
.ann-item .del{float:right;color:var(--red);font-size:11px}

/* ---------- drawer / modal / toast / cmdk ---------- */
.drawer-host{position:fixed;inset:0;z-index:60;pointer-events:none}
.drawer-mask{position:absolute;inset:0;background:rgba(40,60,55,.24);opacity:0;transition:.2s;pointer-events:none}
.drawer-mask.show{opacity:1;pointer-events:auto}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--bg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;transform:translateX(100%);transition:.24s;pointer-events:auto}
.drawer.show{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.drawer-head h3{font-size:14px;margin:0;flex:1}
.drawer-body{flex:1;overflow-y:auto;padding:18px}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:15px;color:var(--muted)}
.icon-btn:hover{color:var(--text);border-color:var(--primary)}
.modal-host{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(40,60,55,.3)}
.modal-host.show{display:flex}
.modal{width:min(520px,100%);max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:20px}
.modal h3{font-size:15px;margin:0 0 4px}
.modal .sub{font-size:11.5px;color:var(--muted);margin-bottom:16px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast-host{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#2c3b43;color:#fff;padding:9px 16px;border-radius:20px;font-size:12px;box-shadow:var(--shadow-lg);animation:tin .22s ease}
.toast.ok{background:var(--primary-deep)}.toast.err{background:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.cmdk{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;padding-top:12vh;background:rgba(40,60,55,.28)}
.cmdk.show{display:flex}
.cmdk-box{width:min(560px,94%);background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:14px;background:var(--panel)}
.cmdk-list{max-height:320px;overflow-y:auto;padding:6px}
.cmdk-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:8px;font-size:12.5px;cursor:pointer}
.cmdk-row:hover,.cmdk-row.sel{background:var(--primary-soft)}
.bottom-nav{display:none}
.timeline{position:relative;padding-left:20px}
.timeline:before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line)}
.commit{position:relative;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:9px;cursor:pointer}
.commit:before{content:"";position:absolute;left:-18px;top:17px;width:9px;height:9px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.commit.sel{border-color:var(--primary);background:var(--primary-soft)}
.commit.agent:before{background:var(--purple);box-shadow:0 0 0 3px var(--purple-s)}
.commit .msg{font-size:12px;font-weight:650}
.commit .meta{font-size:10.5px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.diff-col{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.diff-col .h{padding:7px 10px;background:var(--panel2);font-size:10.5px;color:var(--muted);border-bottom:1px solid var(--line);font-weight:650}
.diff-col .b{padding:10px;font:11px/1.7 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all;min-height:70px}
.diff-add{background:var(--green-s);color:var(--primary-deep)}
.diff-del{background:var(--red-s);color:var(--red)}
.tool-row{border:1px solid var(--line);border-radius:9px;margin-bottom:7px;background:var(--panel);overflow:hidden}
.tool-head{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;font-size:11.8px}
.tool-head:hover{background:var(--panel2)}
.tool-name{font-family:ui-monospace,monospace;font-size:11px;flex:1;word-break:break-all}
.tool-detail{padding:10px 12px;border-top:1px solid var(--line);background:var(--panel2)}
.schema-field{display:grid;grid-template-columns:1.1fr 1fr 62px 62px 28px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.schema-field .select,.schema-field .input{padding:6px 8px;font-size:11px}
.logline{font:10.8px/1.7 ui-monospace,monospace;padding:7px 9px;border-bottom:1px solid var(--line);word-break:break-all}
.logline:last-child{border-bottom:0}
.logline .t{color:var(--faint)}
@media(max-width:1100px){.viewer-shell{grid-template-columns:1fr}.editor-grid{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:768px){

<script>
"use strict";
/* ============================================================

var STORE_KEY = "episteme-prototype-v1";
var THEMES = [["mint","浅绿","var(--green)"],["sky","浅蓝","var(--blue)"],["lilac","浅紫","var(--purple)"],["blush","浅粉","var(--pink)"]];

var STATIC_TOOLS = ["list_spaces","tree","read","search","list_content_types","define_content_type","create_node","move_node","delete_node","create_document","update_document","append_part","annotate","commit","log","diff","branch","merge","revert","export_as_git"];
var UID = 0;
function uid(p){ UID++; return (p||"id") + "_" + Date.now().toString(36) + "_" + UID; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function now(){ return new Date().toISOString(); }
function fmt(t){ try{ var d=new Date(t); return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }catch(e){ return String(t); } }

}

    var docs=[
      {id:uid("d"),nodeId:byPath["/论文库"],typeSlug:"paper",title:"内容寻址版本模型在协同写作中的应用",
       fields:{title:"内容寻址版本模型在协同写作中的应用",year:2026,venue:"预印本",tags:["版本管理","MCP"],sourceUrl:"https://example.org/paper.pdf"},
       parts:[
         {id:uid("p"),kind:"pdf",sourceUri:"https://example.org/paper.pdf",meta:{pages:12,title:"内容寻址版本模型在协同写作中的应用"}},
         {id:uid("p"),kind:"md",content:"## 阅读笔记\n\n- 用 **Tree 快照** 而非增量补丁，diff 更直观。\n- 三条写入路径共享同一条 Commit 链。\n- **待确认**：合并冲突策略是否要人工逐条确认。\n\n### 结论\n适合人机共写的知识库场景。"},

       ],
       annotations:[{id:uid("a"),partKind:"pdf",kind:"highlight",text:"内容寻址快照 DAG",note:"这是与真 git 的核心差异",color:"#ffeaa0"}]},
      {id:uid("d"),nodeId:byPath["/代码片段"],typeSlug:"snippet",title:"PostgreSQL jsonb 表达式索引生成",
       fields:{title:"PostgreSQL jsonb 表达式索引生成",language:"sql",purpose:"按动态字段建索引",tags:["postgres","schema"]},

       annotations:[{id:uid("a"),partKind:"code",kind:"note",text:"dynamic field index",note:"大库需评估选择性",color:"#e9f2fd"}]},
      {id:uid("d"),nodeId:byPath["/网页剪藏"],typeSlug:"clip",title:"MCP 工具动态注册机制解析",
       fields:{title:"MCP 工具动态注册机制解析",sourceUrl:"https://example.org/mcp-tools",fetchedAt:"2026-11-08",tags:["MCP","协议"]},
       parts:[{id:uid("p"),kind:"web",sourceUri:"https://example.org/mcp-tools",meta:{origin:"external"}}],annotations:[]},
      {id:uid("d"),nodeId:byPath["/笔记"],typeSlug:"note",title:"关于「空壳」的几点思考",
       fields:{title:"关于「空壳」的几点思考",tags:["产品"],pinned:true},
       parts:[{id:uid("p"),kind:"md",content:"## 空壳原则\n\n- 内核不内置任何业务名词。\n- 目录与内容类型由用户定义。\n- **Schema 即契约**：字段一改，列表、表单、索引、MCP 工具签名同步重建。\n\n> 变的只有数据，不变的是内核。"}],annotations:[]}
    ];
    return {types:types,nodes:nodes,docs:docs};
  }
};

var TPL_WORKBENCH = {
  id:"workbench", name:"商业短篇创作工作台", desc:"现有 v3.2 产品降级为模板：11 个固定模块 → 11 个可改目录与内容类型",
  build:function(){
    var defs=[
      ["work_archive","作品入库档案",[F("title","作品名","text",{required:true}),F("platform","首发平台","select"),F("track","题材赛道","select"),F("wordCount","总字数","number"),F("synopsis","核心剧情梗","longtext")]],
      ["opening_hook","导语 & 开篇钩子",[F("title","模板名","text",{required:true}),F("style","开篇范式","select"),F("formula","留人公式","longtext"),F("pitfalls","避雷清单","tags")]],
      ["track_topic","赛道选题",[F("title","选题名","text",{required:true}),F("track","赛道","select"),F("formula","爆款公式","longtext"),F("emotionPain","情绪痛点","tags")]],
      ["character","人设素材",[F("title","人设名","text",{required:true}),F("archetype","原型","select"),F("surface","表层人设","longtext"),F("contrast","反差设计","longtext")]],
      ["plot_structure","剧情结构 & 节奏",[F("title","框架名","text",{required:true}),F("wordTier","字数档","select"),F("threeAct","三幕式结构","longtext"),F("emotionCurve","情绪曲线","tags")]],
      ["teardown","拆文复盘",[F("title","拆解对象","text",{required:true}),F("mainHook","核心大梗","longtext"),F("mainConflict","主线冲突","longtext"),F("viralAttribution","爆火归因","longtext"),F("rewritePlan","仿写方案","markdown")]],
      ["quote","金句 & 对话",[F("title","金句","text",{required:true}),F("category","分类","select"),F("emotion","情绪标签","tags")]],
      ["ending_template","结局闭环模板",[F("title","模板名","text",{required:true}),F("endingType","结局类型","select"),F("quickCloseRule","收尾规范","longtext")]],
      ["compliance","平台过稿 & 合规",[F("title","规则名","text",{required:true}),F("platform","平台","select"),F("redLines","审核红线","tags"),F("complianceChecked","合规校验","select",{mcpWritable:false})]],
      ["conflict_material","原创冲突素材",[F("title","素材名","text",{required:true}),F("category","分类","select"),F("detail","素材正文","markdown")]],
      ["hotspot","每日全网热点",[F("title","热点标题","text",{required:true}),F("rank","榜单排名","number"),F("source","来源榜单","select"),F("sourceUrl","原文链接","url"),F("summary","① 精简梗概","longtext"),F("emotionTag","② 情绪标签","tags"),F("dramaticConflict","③ 核心冲突","longtext"),F("novelHook","④ 小说核心梗","longtext"),F("fitTrack","⑤ 适配赛道","select"),F("titleTemplates","⑥ 3 个标题模板","json"),F("blurredText","事实虚化改编","markdown"),F("complianceChecked","合规校验","select",{mcpWritable:false})]],
      ["adaptation","热点改编示范",[F("title","示范标题","text",{required:true}),F("blurredText","改编文本","markdown")]]
    ];

    var names=[["M1-作品入库档案库","work_archive"],["M2-导语开篇钩子库","opening_hook"],["M3-赛道选题库","track_topic"],["M4-人设素材库","character"],["M5-剧情结构节奏库","plot_structure"],["M6-拆文复盘库","teardown"],["M7-金句对话库","quote"],["M8-结局闭环模板库","ending_template"],["M9-平台过稿合规自查库","compliance"],["M10-原创冲突素材储备库","conflict_material"],["M11-每日全网热点库","hotspot"]];
    var nodes=names.map(function(x){return {id:uid("n"),parentId:null,path:"/"+x[0],name:x[0],typeSlug:x[1],exposeToMcp:true,expanded:true};});
    var hot=nodes[10];
    nodes.push({id:uid("n"),parentId:hot.id,path:hot.path+"/每日",name:"每日",typeSlug:"hotspot",exposeToMcp:true,expanded:false});
    nodes.push({id:uid("n"),parentId:hot.id,path:hot.path+"/历史存档",name:"历史存档",typeSlug:"hotspot",exposeToMcp:true,expanded:false});
    nodes.push({id:uid("n"),parentId:hot.id,path:hot.path+"/改编示范",name:"改编示范",typeSlug:"adaptation",exposeToMcp:true,expanded:false});
    nodes.push({id:uid("n"),parentId:hot.id,path:hot.path+"/避雷清单",name:"避雷清单",typeSlug:"compliance",exposeToMcp:false,expanded:false});

};
var TEMPLATES=[TPL_GENERIC,TPL_WORKBENCH];

/* ---------- state ---------- */
function blankSpace(name){
  return {id:uid("sp"),name:name,slug:name.replace(/\s+/g,"_"),createdAt:now(),nodes:[],contentTypes:[],documents:[],commits:[],refs:{},toolsVersion:1,mcpLog:[],installedPacks:[],currentBranch:"main"};
}
function initialState(){ return {theme:"mint",spaces:[],activeSpaceId:null,page:"library",nodeId:null,docId:null,partKind:null,drawer:null,modal:null,webMode:"read",cmdkOpen:false,cmdkQuery:"",diffCommitId:null,busy:false,schemaDraft:null}; }
var S = initialState();
function load(){ try{ var raw=localStorage.getItem(STORE_KEY); if(raw){ var d=JSON.parse(raw); if(d&&d.spaces){ S=Object.assign(initialState(),d); S.drawer=null;S.modal=null;S.cmdkOpen=false;S.busy=false; } } }catch(e){ S=initialState(); } }
function save(){ try{ var c={}; for(var k in S){ if(["modal","drawer","cmdkOpen","busy","schemaDraft"].indexOf(k)<0) c[k]=S[k]; } localStorage.setItem(STORE_KEY,JSON.stringify(c)); }catch(e){} }
function sp(){ return S.spaces.find(function(x){return x.id===S.activeSpaceId;}) || null; }
function nodeById(id){ var s=sp(); return s?s.nodes.find(function(n){return n.id===id;})||null:null; }
function typeBySlug(slug){ var s=sp(); return s?s.contentTypes.find(function(t){return t.slug===slug;})||null:null; }
function typeOfNode(n){ return n&&n.typeSlug?typeBySlug(n.typeSlug):null; }
function docById(id){ var s=sp(); return s?s.documents.find(function(d){return d.id===id;})||null:null; }
function currentNode(){ return S.nodeId?nodeById(S.nodeId):null; }
function currentDoc(){ return S.docId?docById(S.docId):null; }
function docPart(d,kind){ return d?d.parts.find(function(p){return p.kind===kind;})||null:null; }
function head(){ var s=sp(); if(!s) return null; return s.refs[s.currentBranch]||s.refs.main||null; }

/* ---------- commits ---------- */
function commit(message,source,extra){
  var s=sp(); if(!s) return null;
  var c=Object.assign({id:uid("cm"),parents:head()?[head()]:[],message:message||"更新",source:source||"ui",author:source==="mcp"?"claude-desktop":"你",agentId:source==="mcp"?"claude-desktop":null,reason:"",branch:s.currentBranch,ts:now(),stats:{added:0,modified:1,deleted:0},changes:[]},extra||{});
  s.commits.unshift(c); s.refs[s.currentBranch]=c.id;
  return c;
}
function logMcp(line){ var s=sp(); if(!s) return; s.mcpLog.unshift({t:now(),line:line}); if(s.mcpLog.length>60)s.mcpLog.pop(); }
function bumpTools(){ var s=sp(); if(!s)return; s.toolsVersion++; logMcp("notifications/tools/list_changed → toolsVersion="+s.toolsVersion); }

/* ---------- dynamic MCP tools ---------- */
function buildTools(){
  var s=sp(); if(!s) return {statics:[],derived:[],version:0,total:0};
  var derived=[];
  s.contentTypes.forEach(function(t){
    var bound=s.nodes.some(function(n){return n.typeSlug===t.slug&&n.exposeToMcp;});
    if(!t.exposeToMcp||!bound) return;
    var visible=t.fields.filter(function(f){return f.exposeToMcp;});
    var writable=visible.filter(function(f){return f.mcpWritable;});
    ["query","create","update"].forEach(function(op){
      derived.push({name:"episteme."+op+"_"+t.slug,op:op,slug:t.slug,label:t.label,version:t.version,fields:op==="query"?visible.filter(function(f){return f.indexed;}):writable,required:op==="create"?writable.filter(function(f){return f.required;}).map(function(f){return f.key;}):(op==="update"?["docId"]:[])});
    });
  });
  return {statics:STATIC_TOOLS.map(function(n){return "episteme."+n;}),derived:derived,version:s.toolsVersion,total:STATIC_TOOLS.length+derived.length};
}
function fieldJsonType(t){
  switch(t){
    case "number":return "integer"; case "boolean":return "boolean"; case "date":return "string (date-time)";
    case "tags":case "multi_select":return "array<string>"; case "json":case "file":case "code":return "object";
    case "url":return "string (uri)"; default:return "string";
  }
}
function toolSchema(tool){
  var props={};
  tool.fields.forEach(function(f){ props[f.key]={type:fieldJsonType(f.type),description:f.label+(f.mcpWritable?"":" · 只读")}; });
  if(tool.op==="query"){props.page={type:"integer",default:1};props.pageSize={type:"integer",default:20};}
  if(tool.op==="create"){props.nodePath={type:"string",description:"目标目录路径"};props.parts={type:"array",description:"可选媒介部件 md/code/pdf/web"};props.branch={type:"string",description:"默认 refs/heads/main"};props.reason={type:"string",description:"写入 Commit 的审计理由"};props.expectParent={type:"string",description:"乐观锁"};props.idempotencyKey={type:"string",description:"幂等键"};props.dryRun={type:"boolean",description:"仅返回 diff 预览"};}
  if(tool.op==="update"){props.branch={type:"string"};props.reason={type:"string"};props.expectParent={type:"string"};}
  return {name:tool.name,description:"在节点下"+({query:"查询",create:"新建",update:"更新"}[tool.op])+"「"+tool.label+"」文档；Schema v"+tool.version+" 自动生成",inputSchema:{type:"object",properties:props,required:tool.required}};
}

/* ---------- render helpers ---------- */
function chip(text,color){ return '<span class="chip '+(color||"")+'">'+esc(text)+"</span>"; }
function btn(text,action,extra,cls){ return '<button class="btn '+(cls||"")+'" data-action="'+action+'" '+(extra||"")+">"+text+"</button>"; }
function pageHead(title,desc,actions){ return '<div class="page-head"><div><h1 class="page-title">'+esc(title)+'</h1><div class="page-desc">'+esc(desc)+"</div></div><div class=\"head-actions\">"+(actions||"")+"</div></div>"; }

/* ---------- render: shell ---------- */
function renderShell(){
  var s=sp();
  document.documentElement.setAttribute("data-theme",S.theme);
  document.getElementById("themeDots").innerHTML=THEMES.map(function(t){return '<button class="theme-dot'+(S.theme===t[0]?" active":"")+'" style="background:'+t[2]+'" data-action="theme" data-theme="'+t[0]+'" title="'+t[1]+'" aria-label="'+t[1]+'"></button>';}).join("");
  var sel=document.getElementById("spaceSelect");
  sel.innerHTML=S.spaces.length?S.spaces.map(function(x){return '<option value="'+esc(x.id)+'"'+(x.id===S.activeSpaceId?" selected":"")+">"+esc(x.name)+"</option>";}).join(""):'<option value="">（尚无空间）</option>';
  var tools=buildTools();
  document.getElementById("toolsVerTop").textContent="v"+tools.version;
  document.getElementById("mcpPill").title="动态 MCP 工具 "+tools.total+" 个 · toolsVersion v"+tools.version;
  renderSidebar();
  renderCrumb();
  renderBottomNav();
}
function renderSidebar(){
  var s=sp(),h="";

function mdToHtml(src){
  var lines=esc(src||"").split("\n"),out="",inCode=false,inList=false;
  for(var i=0;i<lines.length;i++){
    var L=lines[i];
    if(L.indexOf("```")===0){ if(inCode){out+="</code></pre>";inCode=false;}else{if(inList){out+="</ul>";inList=false;}out+="<pre><code>";inCode=true;} continue; }
    if(inCode){ out+=L+"\n"; continue; }
    if(/^### /.test(L)){ if(inList){out+="</ul>";inList=false;} out+="<h3>"+inlineMd(L.slice(4))+"</h3>"; continue; }
    if(/^## /.test(L)){ if(inList){out+="</ul>";inList=false;} out+="<h2>"+inlineMd(L.slice(3))+"</h2>"; continue; }
    if(/^&gt; /.test(L)){ out+="<p style=\"border-left:3px solid var(--primary);padding-left:10px;color:var(--muted)\">"+inlineMd(L.slice(5))+"</p>"; continue; }
    if(/^[-*] /.test(L)){ if(!inList){out+="<ul>";inList=true;} out+="<li>"+inlineMd(L.slice(2))+"</li>"; continue; }
    if(inList){out+="</ul>";inList=false;}
    if(L.trim()===""){out+="<div style=\"height:6px\"></div>";continue;}
    out+="<p>"+inlineMd(L)+"</p>";
  }
  if(inCode)out+="</code></pre>"; if(inList)out+="</ul>";
  return out;
}
function inlineMd(s){
  return s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
}
function renderMd(d,p){

function dynamicForm(t){
  if(!t)return '<div class="tiny muted">请先创建内容类型。</div>';
  return '<div class="divider"></div><div class="section-title" style="font-size:11.5px">Schema 字段 · '+esc(t.label)+" v"+t.version+"</div>"+
    t.fields.map(function(f){
      var req=f.required?' <span style="color:var(--red)">*</span>':"";
      var inp;
      if(f.type==="boolean")inp='<select class="select" data-fkey="'+esc(f.key)+'"><option value="false">否</option><option value="true">是</option></select>';
      else if(f.type==="select")inp='<select class="select" data-fkey="'+esc(f.key)+'">'+(f.options||["选项 A","选项 B","选项 C"]).map(function(o){return '<option value="'+esc(o)+'">'+esc(o)+"</option>";}).join("")+"</select>";
      else if(["longtext","markdown","code","json"].indexOf(f.type)>=0)inp='<textarea class="textarea" style="min-height:60px" data-fkey="'+esc(f.key)+'" placeholder="'+esc(f.label)+'"></textarea>';

/* ---------- toast ---------- */

  var el=document.createElement("div");el.className="toast "+(type||"");el.textContent=msg;
  document.getElementById("toastHost").appendChild(el);

function download(name,text){
  try{var b=new Blob([text],{type:"application/json;charset=utf-8"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();toast("已导出 "+name,"ok");}catch(e){toast("导出失败："+e.message,"err");}

/* ---------- actions ---------- */
function installTemplate(id){
  var s=sp(),t=TEMPLATES.find(function(x){return x.id===id;});if(!s||!t)return;
  var b=t.build();
  b.types.forEach(function(ct2){
    var ex=s.contentTypes.find(function(x){return x.slug===ct2.slug;});
    if(!ex)s.contentTypes.push(ct2);
  });
  var idmap={};
  b.nodes.forEach(function(n){
    if(s.nodes.some(function(x){return x.path===n.path;}))return;
    var oldId=n.id,clone=Object.assign({},n,{id:uid("n")});
    idmap[oldId]=clone.id;
    if(n.parentId)clone.parentId=idmap[n.parentId]||null;
    s.nodes.push(clone);
  });
  b.docs.forEach(function(d){
    if(s.documents.some(function(x){return x.title===d.title;}))return;
    var clone=JSON.parse(JSON.stringify(d));
    clone.nodeId=idmap[d.nodeId]||d.nodeId;
    clone.createdAt=now();clone.updatedAt=now();
    s.documents.push(clone);
  });
  if(s.installedPacks.indexOf(t.id)<0)s.installedPacks.push(t.id);
  bumpTools();
  commit("安装模板 Pack「"+t.name+"」","import",{stats:{added:b.nodes.length,modified:0,deleted:0},changes:[{path:"/",op:"added",field:"目录节点",from:"0",to:String(b.nodes.length)},{path:"/",op:"added",field:"内容类型",from:"0",to:String(b.types.length)}]});
  S.page="library";S.nodeId=null;S.docId=null;
  save();renderAll();toast("已安装「"+t.name+"」：目录与 Schema 已生成，toolsVersion v"+s.toolsVersion,"ok");
}
function createSpace(name){
  var s=blankSpace(name||"未命名空间");
  S.spaces.push(s);S.activeSpaceId=s.id;S.page="library";S.nodeId=null;S.docId=null;
  commit("创建空间「"+s.name+"」","system",{branch:"main"});
  save();renderAll();toast("空间已创建：0 目录 / 0 类型 / 0 文档","ok");
}
function saveSchema(tid,msg){
  var s=sp(),t=s.contentTypes.find(function(x){return x.id===tid;});if(!t)return;
  t.version++;bumpTools();
  commit(msg||("更新 Schema「"+t.label+"」→ v"+t.version),"schema",{changes:[{field:"contentType.version",from:"v"+(t.version-1),to:"v"+t.version},{field:"toolsVersion",from:"v"+(s.toolsVersion-1),to:"v"+s.toolsVersion}]});
  save();renderAll();toast("Schema 已保存：v"+t.version+" · 工具签名已重建 · toolsVersion v"+s.toolsVersion,"ok");
}
function agentWrite(){
  var s=sp();if(!s)return;
  if(!s.nodes.length){toast("请先安装模板或新建目录","err");return;}
  var target=s.nodes.find(function(n){return n.typeSlug&&n.exposeToMcp;})||s.nodes[0];
  var t=typeBySlug(target.typeSlug)||s.contentTypes[0];
  if(!t){toast("请先创建内容类型","err");return;}
  var fields={};t.fields.forEach(function(f){fields[f.key]=f.required?("Agent 写入 · "+f.label):"";});
  fields.title="Agent 采集："+t.label+" "+(s.documents.length+1);
  var d={id:uid("d"),nodeId:target.id,typeSlug:t.slug,title:fields.title,fields:fields,
    parts:[{id:uid("p"),kind:(t.defaultPartKinds&&t.defaultPartKinds[0])||"md",content:"## Agent 自动写入\n\n- 来源：MCP 模拟调用\n- 分支：agent/demo（隔离）\n- 可由人工审阅后合并，或按 agentId 整批撤销。",language:"markdown",sourceUri:"https://example.org/agent-feed",meta:{origin:"external"}}],
    annotations:[],createdAt:now(),updatedAt:now()};
  s.documents.push(d);
  var prevBranch=s.currentBranch;
  if(!s.refs["agent/demo"])s.refs["agent/demo"]=s.refs[prevBranch]||null;
  s.currentBranch="agent/demo";
  commit("Agent 写入「"+d.title+"」","mcp",{reason:"每日情报采集任务自动写入",agentId:"claude-desktop",branch:"agent/demo",changes:[{field:"文档",from:"—",to:d.title},{field:"分支",from:"main",to:"agent/demo"}]});
  s.currentBranch=prevBranch;
  logMcp("tools/call episteme.create_"+t.slug+" → commit="+shortId(s.commits[0].id)+" branch=agent/demo");
  logMcp("notifications/resources/list_changed → /"+target.name);
  save();renderAll();toast("Agent 已在 agent/demo 分支写入 1 篇文档并生成 Commit，可在版本面板审阅 / 合并 / 撤销","ok");
}
function revertCommit(id){
  var s=sp(),c=s.commits.find(function(x){return x.id===id;});if(!c)return;
  commit('Revert "'+c.message+'"',"system",{reason:"人工回滚提交 "+shortId(c.id),changes:[{field:"回滚",from:c.message,to:"恢复至父版本"}]});
  S.diffCommitId=null;save();renderAll();toast("已生成反向提交（历史未被改写）","ok");
}
function mergeBranch(){
  var s=sp();if(!s||!s.refs["agent/demo"])return;
  var c=commit("合并 agent/demo → main","system",{parents:[s.refs.main,s.refs["agent/demo"]].filter(Boolean),reason:"人工审阅通过",changes:[{field:"分支合并",from:"agent/demo",to:"main"}]});
  delete s.refs["agent/demo"];s.currentBranch="main";
  save();renderAll();toast("已合并到 main，生成双 parent Commit","ok");
}
function addAnnotation(partKind,quote,note,kind){
  var d=currentDoc();if(!d)return;
  var p=docPart(d,partKind);if(!p)return;
  d.annotations.push({id:uid("a"),partKind:partKind,partId:p.id,kind:kind||"highlight",text:quote||"",note:note||"",color:"#ffeaa0",anchor:{kind:partKind,textQuote:{exact:quote},page:partKind==="pdf"?2:null}});
  commit("新增"+(kind==="note"?"批注":"高亮")+" · "+partKind.toUpperCase(),"ui",{changes:[{field:"annotations",from:String(d.annotations.length-1),to:String(d.annotations.length)}]});
  save();renderAll();toast("标记已保存并进入版本历史","ok");

function exportAnnotations(){
  var d=currentDoc();if(!d)return;
  var md="# "+d.title+" · 标记汇总\n\n";
  d.annotations.forEach(function(a,i){md+=(i+1)+". ["+a.partKind+"] "+(a.text?"**"+a.text+"** — ":"")+(a.note||"")+"\n";});
  download("episteme-annotations.md",md);
  commit("导出标记汇总为 Markdown","ui",{changes:[{field:"export",from:"—",to:"annotations.md"}]});
  save();renderAll();

/* input / change delegation（不触发全量重绘，避免编辑器失焦） */
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="cmdkInput"){S.cmdkQuery=t.value;renderCmdk();return;}
  if(t.id==="partEditor"){
    S.draft={partId:t.getAttribute("data-draft"),value:t.value};
    var prev=document.getElementById("mdPreview");if(prev)prev.innerHTML=mdToHtml(t.value);
    var cv=document.getElementById("codeView");if(cv)cv.innerHTML=highlightCode(t.value);
    return;
  }
  if(t.id==="docSearch"){S.docQuery=t.value;renderContent();var el=document.getElementById("docSearch");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length);}return;}
  var b=t.getAttribute("data-bind");
  if(b==="field-label"){
    var s=sp(),ct3=s.contentTypes.find(function(x){return x.id===t.getAttribute("data-tid");});
    if(ct3){var f=ct3.fields.find(function(x){return x.key===t.getAttribute("data-fid");});if(f)f.label=t.value;}
  }
});
document.addEventListener("change",function(e){
  var t=e.target,b=t.getAttribute("data-bind"),s=sp();if(!s)return;
  if(b==="space"){S.activeSpaceId=t.value;S.page="library";S.nodeId=null;S.docId=null;S.drawer=null;save();renderAll();return;}
  if(b==="branch"){S.currentBranch=t.value;save();renderDrawer();toast("已切换到分支 "+t.value,"ok");return;}
  if(b&&b.indexOf("field-")===0){
    var tid=t.getAttribute("data-tid"),fid=t.getAttribute("data-fid");
    var ct4=s.contentTypes.find(function(x){return x.id===tid;});
    var f2=ct4?ct4.fields.find(function(x){return x.key===fid;}):null;
    if(!f2)return;
    if(b==="field-type")f2.type=t.value;
    if(b==="field-required")f2.required=t.checked;
    if(b==="field-expose")f2.exposeToMcp=t.checked;
    save();return;
  }
  if(t.id==="mDocType"){
    var slug=t.value,box=document.getElementById("dynamicFields");
    if(box)box.innerHTML=dynamicForm(typeBySlug(slug));
    var kt=typeBySlug(slug),ks=document.getElementById("mPartKind");
    if(kt&&ks&&kt.defaultPartKinds&&kt.defaultPartKinds.length)ks.value=kt.defaultPartKinds[0];
    return;
  }
});
document.addEventListener("keydown",function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();S.cmdkOpen=!S.cmdkOpen;document.getElementById("cmdk").classList.toggle("show",S.cmdkOpen);if(S.cmdkOpen){document.getElementById("cmdkInput").value="";S.cmdkQuery="";renderCmdk();setTimeout(function(){document.getElementById("cmdkInput").focus();},30);}return;}
  if(e.key==="Escape"){if(S.modal)closeModal();else if(S.cmdkOpen){S.cmdkOpen=false;document.getElementById("cmdk").classList.remove("show");}else if(S.drawer){S.drawer=null;renderDrawer();renderBottomNav();}return;}
  if(S.cmdkOpen&&e.key==="Enter"){doCmdk(0);}
});
function cmdkItems(){
  var s=sp(),q=(S.cmdkQuery||"").toLowerCase(),items=[];
  if(!s)return items;
  items.push({label:"跳到 文档",sub:"首页",act:"open-page",page:"library"});
  items.push({label:"跳到 Schema / 内容类型",sub:"定义字段",act:"open-page",page:"schema"});
  items.push({label:"跳到 模板 Pack",sub:"安装模板",act:"open-page",page:"templates"});
  items.push({label:"跳到 MCP 工具",sub:"动态工具清单",act:"open-page",page:"mcp"});
  items.push({label:"打开 版本历史",sub:"Commit 链",act:"open-drawer",drawer:"version"});
  items.push({label:"模拟 Agent 写入",sub:"在隔离分支生成 Commit",act:"agent-write"});
  s.documents.forEach(function(d){items.push({label:d.title,sub:"文档 · "+d.typeSlug,act:"open-doc",id:d.id});});
  s.nodes.forEach(function(n){items.push({label:n.name,sub:"目录 · "+n.path,act:"select-node",id:n.id});});
  return items.filter(function(x){return !q||(x.label+" "+x.sub).toLowerCase().indexOf(q)>=0;}).slice(0,14);
}
function renderCmdk(){
  var items=cmdkItems();
  document.getElementById("cmdkList").innerHTML=items.length?items.map(function(x,i){
    return '<div class="cmdk-row'+(i===0?" sel":"")+'" data-cmdk="'+i+'"><span>⌘</span><span style="flex:1">'+esc(x.label)+'</span><span class="tiny muted">'+esc(x.sub)+"</span></div>";
  }).join(""):'<div class="cmdk-row tiny muted">没有匹配项</div>';
}
function doCmdk(i){
  var it=cmdkItems()[i];
  S.cmdkOpen=false;document.getElementById("cmdk").classList.remove("show");
  if(!it){save();renderAll();return;}
  if(it.act==="open-page"){S.page=it.page;S.docId=null;}
  else if(it.act==="open-drawer"){S.drawer=it.drawer;}
  else if(it.act==="open-doc"){S.docId=it.id;S.page="library";S.partKind=null;}
  else if(it.act==="select-node"){S.nodeId=it.id;S.page="library";S.docId=null;}
  else if(it.act==="agent-write"){agentWrite();return;}
  save();renderAll();
}
document.getElementById("cmdkList").addEventListener("click",function(e){
  var r=e.target.closest("[data-cmdk]");if(r)doCmdk(parseInt(r.getAttribute("data-cmdk"),10));
});
document.getElementById("cmdk").addEventListener("click",function(e){if(e.target.id==="cmdk"){S.cmdkOpen=false;this.classList.remove("show");}});
document.getElementById("modalHost").addEventListener("click",function(e){if(e.target.id==="modalHost")closeModal();});

/* ---------- boot ---------- */
function renderAll(){ renderShell();renderContent();renderDrawer();renderBottomNav(); }
load();renderAll();
window.EpistemePrototype={getState:function(){return S;},buildTools:buildTools,reset:function(){localStorage.removeItem(STORE_KEY);S=initialState();save();renderAll();}};
</script>
</body>
</html>
